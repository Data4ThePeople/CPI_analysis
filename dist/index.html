*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{container:page / inline-size}
html{min-height:100%;background:var(--sky)}
#app{width:100%;min-width:0;max-width:1180px;margin:0 auto;padding:18px 16px 10px;height:780px;display:flex;flex-direction:column;container-type:inline-size}
body.is-embed #app{max-width:none;padding:12px 16px 8px;overflow:hidden}
header h1{font-size:22px;line-height:1.2;margin:0 0 4px;font-weight:700}
header p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.4}
#controls{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:10px 0 4px}
.seg{display:inline-flex;background:var(--btn);border-radius:8px;padding:3px}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--dn-4);outline-offset:1px}
#legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
#legend .bar{display:flex;border-radius:3px;overflow:hidden}
#legend .bar span{display:block;width:22px;height:12px}
#legend .ticks{display:flex;font-size:11px;color:var(--muted)}
#stage{position:relative;flex:1;min-height:0}
#chart{position:absolute;inset:0;width:100%;height:100%;display:block}
#table-wrap{position:absolute;inset:0;overflow:auto;display:none;background:var(--bg)}
#table-wrap.on{display:block}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{position:sticky;top:0;background:var(--bg);color:var(--ink-2);font-weight:600;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
th:focus-visible{outline:2px solid var(--dn-4);outline-offset:-2px}
footer{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--muted);padding-top:6px;flex-wrap:wrap}
footer a{color:inherit}
#tip{position:fixed;pointer-events:none;z-index:9;background:var(--tip-bg);border:1px solid var(--tip-edge);border-radius:8px;
  padding:9px 11px;font-size:12.5px;line-height:1.45;color:var(--ink);box-shadow:0 4px 18px rgba(0,0,0,.18);max-width:280px;display:none}
#tip b{display:block;font-size:13.5px;margin-bottom:3px}
#tip .k{color:var(--muted)}
#tip .note{color:var(--muted);font-size:11.5px;margin-top:4px}
svg text{font-family:inherit}
.tile{stroke:var(--panel);stroke-width:1;cursor:default}
.tile:hover,.tile.hl{stroke:var(--ink);stroke-width:2}
.lab{pointer-events:none;font-weight:600}
.axis-lab{fill:var(--muted);font-size:11px}
.big{font-weight:700}
#mover{transition:transform .9s cubic-bezier(.45,.05,.25,1)}
@media (prefers-reduced-motion: reduce){#mover{transition:none}}
#timeline{display:none;align-items:center;gap:10px;padding-top:6px}
body.series #timeline{display:flex}
#play{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:8px;background:var(--btn-on);color:var(--btn-on-ink);
  padding:7px 12px;cursor:pointer;min-width:74px}
#play:focus-visible,#strip:focus-visible{outline:2px solid var(--dn-4);outline-offset:2px}
#when{min-width:112px;font-size:15px;font-weight:700;white-space:nowrap}
#strip{flex:1;min-width:0;height:52px;display:block;cursor:pointer;touch-action:none}
#note{display:none;font-size:11.5px;color:var(--muted);padding-top:3px}
#source.is-note{color:var(--ink-2)}
/* #hero: a still for the post's hero image. The balloon alone on the right, no axis;
   the title, a line of text and the color key on the left. */
body.hero #app{height:100vh;max-width:none;padding:40px 48px 26px;display:grid;
  grid-template-columns:36% 1fr;grid-template-rows:1fr auto auto 1fr auto;column-gap:28px}
body.hero header{grid-column:1;grid-row:2}
body.hero #controls{grid-column:1;grid-row:3;margin:22px 0 0}
body.hero #stage{grid-column:2;grid-row:1 / 6}
body.hero #side{display:none}
body.hero footer{grid-column:1;grid-row:5;font-size:13px}
body.hero .seg,body.hero #source{display:none}
/* #gif: frames for the email and social GIF; no buttons, flat sky (GIF palettes band on gradients) */
body.gif #app{height:100vh;max-width:none;padding:16px 18px 8px}
body.gif .seg,body.gif #play,body.gif #source{display:none}
body.gif #when{font-size:22px;min-width:150px}
html:has(body.gif){background:#d3e6f6}
/* #hero&bare: the balloon alone, no text outside it; #clear: transparent background */
body.hero.bare #app{grid-template-columns:1fr;padding:30px}
body.hero.bare header,body.hero.bare #controls,body.hero.bare footer{display:none}
body.hero.bare #stage{grid-column:1}
body.clear,body.clear #app{background:transparent}
html:has(body.clear){background:transparent}
body.hero header h1{font-size:50px;line-height:1.08;margin-bottom:16px}
body.hero header p{font-size:19px;line-height:1.45}
body.hero #legend{font-size:13px}
@container (max-width:620px){
  #when{min-width:84px;font-size:13px}
  #timeline{flex-wrap:wrap;row-gap:4px}
  #strip{flex:1 1 100%;order:3;height:46px}
  #play{min-width:0;padding:7px 10px}
  header h1{font-size:18px}
  header p{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #legend .lbl{display:none}
  .seg button{padding:6px 9px;font-size:12.5px}
  .long{display:none}
}
</style>
</head>

function shapeTable(H) {                            // cumulative area from the top, in px^2, for an envelope H px tall

// Bands: rows whose heights follow the outline, filled left to right. Each band's
// area equals the area of the envelope slice it covers, so box area stays exact.
function bandLayout(items, cx, top, H) {

// Squarified treemap in a rectangle (Bruls, Huizing and van Wijk), for the sandbag.

  const out = []; const sum = items.reduce((s, d) => s + d.v, 0); if (!sum) return out;

}

function labelTile(g, b, fs, ink, edge) {
  if (b.w < 40 || b.h < fs * 2.4) return false;

    h2.textContent = state.view === 'core' ? 'core CPI, 12 months' : 'all items, 12 months';
  } else {
  el('line', { x1: axisX, x2: cx - basketW / 2 - 4, y1: baseY, y2: baseY, stroke: css('--ink'), 'stroke-width': 1, 'stroke-dasharray': '2 3' }, mk);
  const tag = el('text', { x: axisX + 6, y: baseY - 20, fill: css('--ink'), 'font-size': narrow ? 14 : 16, class: 'big' }, mk);
  tag.textContent = `${state.view === 'core' ? 'Core' : 'All items'} ${V.published.toFixed(2)}%`;
  const sub = el('text', { x: axisX + 6, y: baseY - 6, fill: css('--muted'), 'font-size': 11 }, mk);
  sub.textContent = `items add up to ${V.sum.toFixed(2)}%`;
  }
  // glide from the previous altitude
  requestAnimationFrame(() => requestAnimationFrame(() => { mover.style.transition = ''; mover.style.transitionDuration = glide; mover.style.transform = 'translate(0px,0px)'; }));
  svg.dataset.lastY = baseY;
  document.body.setAttribute('data-ready', '1');
}

// Table sort: click (or Enter on) a header to sort by it; click again to flip the order.
// A new column starts high to low (names start A to Z). The sum row stays at the bottom.
const SORT = { key: 'c', dir: -1 };
const COLS = [['f', 'Item'], ['w', 'Weight'], ['y', 'Price change, 12 months'], ['c', 'Added (pts)']];
let lastV = null;
function renderTable(V) {
  lastV = V;
  const val = d => SORT.key === 'f' ? d.f.toLowerCase() : (d[SORT.key] == null ? -Infinity : d[SORT.key]);
  const rows = V.items.slice().sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * SORT.dir || b.c - a.c; });
  const T = $('#table');
  const head = COLS.map(([k, lab]) => {
    const on = SORT.key === k, arrow = on ? (SORT.dir < 0 ? ' ▼' : ' ▲') : '';
    const aria = on ? (SORT.dir < 0 ? 'descending' : 'ascending') : 'none';
    return `<th data-sort="${k}" aria-sort="${aria}" tabindex="0" title="Sort">${lab}${arrow}</th>`;
  }).join('');
  T.innerHTML = `<thead><tr>${head}</tr></thead><tbody>` +
    rows.map(d => `<tr><td>${d.f}${d.fill ? ' *' : ''}</td><td>${fmtW(d.w)}</td><td>${fmtPct(d.y)}</td><td>${fmtPts(d.c)}</td></tr>`).join('') +
    `<tr><td><b>Sum of items</b></td><td>${fmtW(rows.reduce((s, d) => s + d.w, 0))}</td><td></td><td><b>${fmtPts(V.sum)}</b></td></tr></tbody>` +
    `<caption style="caption-side:bottom;text-align:left;font-size:11.5px;color:var(--muted);padding:6px 8px">* No published index for these months; change is what is left of its parent group’s published change. Click a column heading to sort.</caption>`;
}
function sortBy(k) {
  if (SORT.key === k) SORT.dir = -SORT.dir;
  else { SORT.key = k; SORT.dir = k === 'f' ? 1 : -1; }
  if (lastV) renderTable(lastV);
}
$('#table').addEventListener('click', e => { const th = e.target.closest('th[data-sort]'); if (th) sortBy(th.dataset.sort); });
$('#table').addEventListener('keydown', e => { const th = e.target.closest('th[data-sort]'); if (th && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); sortBy(th.dataset.sort); } });

document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
  state.view = b.dataset.view;
  document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
}));
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
  state.mode = b.dataset.mode;
  document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
  $('#table-wrap').classList.toggle('on', state.mode === 'table');
}));
// ---- timeline: a small line of the 12-month rate, one point per month; click, drag or use arrow keys ----
const strip = $('#strip');
const cal = (() => { if (!SERIES) return [];                 // every calendar month, published or not
  const out = []; let [y, m] = DATA.order[0].split('-').map(Number); const end = DATA.order[DATA.order.length - 1];
  for (;;) { const k = `${y}-${String(m).padStart(2, '0')}`; out.push(k); if (k === end) break; m++; if (m > 12) { m = 1; y++; } }
  return out; })();
let stripX = () => 0;
function drawStrip() {
  strip.innerHTML = '';
  const W = strip.clientWidth, H = strip.clientHeight; if (!W || !H) return;
  const pad = 8, top = 5, bot = H - 14;
  const vals = DATA.order.map(t => DATA.months[t].views[state.view].published);
  const lo = Math.min(0, ...vals), hi = Math.max(...vals);
  const x = i => pad + i / (cal.length - 1) * (W - 2 * pad), y = v => bot - (v - lo) / (hi - lo) * (bot - top);
  stripX = x;
  el('line', { x1: pad, x2: W - pad, y1: y(DATA.axis.target), y2: y(DATA.axis.target), stroke: css('--target'), 'stroke-dasharray': '3 3', 'stroke-width': 1 }, strip);
  let d = '', pen = false;
  cal.forEach((t, i) => { const M = DATA.months[t];
    if (!M) { pen = false; return; }
    d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(M.views[state.view].published).toFixed(1); pen = true; });
  el('path', { d, fill: 'none', stroke: css('--ink-2'), 'stroke-width': 1.6, 'stroke-linejoin': 'round' }, strip);
  cal.forEach((t, i) => { if (t.endsWith('-01')) {
    el('line', { x1: x(i), x2: x(i), y1: bot + 1, y2: bot + 4, stroke: css('--axis') }, strip);
    if (W > 420 || +t.slice(0, 4) % 2 === 0) { const tl = el('text', { x: x(i), y: H - 2, 'text-anchor': 'middle', class: 'axis-lab', 'font-size': 10 }, strip); tl.textContent = t.slice(0, 4); } } });
  const i = cal.indexOf(state.month), v = DATA.months[state.month].views[state.view].published;
  el('line', { x1: x(i), x2: x(i), y1: top - 3, y2: bot, stroke: css('--ink'), 'stroke-width': 1 }, strip);
  el('circle', { cx: x(i), cy: y(v), r: 4.5, fill: css('--ink'), stroke: css('--bg'), 'stroke-width': 2 }, strip);
  strip.setAttribute('aria-valuetext', `${DATA.months[state.month].label}, ${v.toFixed(2)}%`);
}
function go(t) {
  if (!DATA.months[t] || t === state.month) return;
  state.month = t; render();
}
function stepBy(k) {
  const i = DATA.order.indexOf(state.month) + k;
  if (i >= 0 && i < DATA.order.length) go(DATA.order[i]);
}
function nearest(clientX) {
  const r = strip.getBoundingClientRect(); let best = null, bd = Infinity;
  cal.forEach((t, i) => { if (!DATA.months[t]) return; const dd = Math.abs(stripX(i) - (clientX - r.left)); if (dd < bd) { bd = dd; best = t; } });
  return best;
}
let timer = null;
function setPlaying(on) {
  state.playing = on; $('#play').textContent = on ? 'Pause' : 'Play';
  clearInterval(timer);
  if (on) {
    if (state.month === DATA.order[DATA.order.length - 1]) { state.month = DATA.order[0]; render(); }
    timer = setInterval(() => {
      const i = DATA.order.indexOf(state.month);
      if (i >= DATA.order.length - 1) { setPlaying(false); return; }
      go(DATA.order[i + 1]);
    }, 700 / state.speed);
  }
}
if (SERIES) {
  $('#play').addEventListener('click', () => setPlaying(!state.playing));
  const speeds = document.querySelectorAll('[data-speed]');
  speeds.forEach(x => x.setAttribute('aria-pressed', +x.dataset.speed === state.speed));
  speeds.forEach(b => b.addEventListener('click', () => {
    state.speed = +b.dataset.speed;
    speeds.forEach(x => x.setAttribute('aria-pressed', x === b));
    if (state.playing) setPlaying(true);           // restart the timer at the new speed, from the current month
  }));
  let dragging = false;
  strip.addEventListener('pointerdown', e => { dragging = true; strip.setPointerCapture(e.pointerId); setPlaying(false); go(nearest(e.clientX)); });
  strip.addEventListener('pointermove', e => { if (dragging) go(nearest(e.clientX)); });
  strip.addEventListener('pointerup', () => { dragging = false; });
  strip.addEventListener('keydown', e => {
    const k = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1, PageDown: -12, PageUp: 12 }[e.key];
    if (k) { setPlaying(false); stepBy(k); e.preventDefault(); }
    else if (e.key === 'Home') { setPlaying(false); go(DATA.order[0]); e.preventDefault(); }
    else if (e.key === 'End') { setPlaying(false); go(DATA.order[DATA.order.length - 1]); e.preventDefault(); }
    else if (e.key === ' ') { setPlaying(!state.playing); e.preventDefault(); }
  });
}

let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(() => { delete svg.dataset.lastY; render(); }, 80); }).observe($('#stage'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
render();
if (SERIES && /play/.test(location.hash) && !matchMedia('(prefers-reduced-motion: reduce)').matches) setPlaying(true);
</script>

</body>
</html>
